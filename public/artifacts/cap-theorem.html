<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAP theorem, hands on</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --ink: #1f1d1a; --muted: #6b655c; --line: #e7e1d6;
    --accent: #b4532a; --ok: #2f7d4f; --bad: #b83a3a; --warn: #a0700f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --surface: #1f1d1a; --ink: #ece6dc; --muted: #a39b8e; --line: #34302a;
      --accent: #e08a5f; --ok: #6cc08f; --bad: #e57373; --warn: #e0b24f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --surface: #1f1d1a; --ink: #ece6dc; --muted: #a39b8e; --line: #34302a;
    --accent: #e08a5f; --ok: #6cc08f; --bad: #e57373; --warn: #e0b24f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1, h2 { font-family: Newsreader, Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 20px; }
  code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .86em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .cluster { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 16px; }
  .node { text-align: center; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .node .name { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .node .val { font: 600 2rem "JetBrains Mono", monospace; margin: 4px 0 0; transition: color .3s; }
  .node.stale .val { color: var(--warn); }
  .link { width: 64px; height: 4px; border-radius: 2px; background: var(--ok); position: relative; transition: background .3s; }
  .link.cut { background: repeating-linear-gradient(90deg, var(--bad) 0 6px, transparent 6px 12px); }
  .link.cut::after { content: "✂"; position: absolute; left: 50%; top: -14px; transform: translateX(-50%); color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 8px 14px; font: 500 .9rem Inter, sans-serif; color: var(--muted); cursor: pointer; min-height: 40px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .95rem Inter, sans-serif; cursor: pointer; }
  .actions button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .label { font-size: .8rem; color: var(--muted); margin: 0 0 6px; }
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .pill { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: .9rem; }
  .pill b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .pill.good { border-color: var(--ok); } .pill.bad { border-color: var(--bad); }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--bg); border-left: 3px solid var(--line); font-size: .92rem; min-height: 48px; }
  .msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); } .msg.warn { border-color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>CAP theorem, hands on</h1>
  <p class="lede">Two replicas hold the value <code>x</code>. Clients write to <b>A</b> and read from <b>B</b>. Cut the network and see what you're forced to give up.</p>

  <section class="card">
    <div class="cluster" aria-label="Replicas">
      <div class="node" id="nodeA"><div class="name">Replica A</div><div class="val" id="valA">0</div></div>
      <div class="link" id="link" role="img" aria-label="Network link"></div>
      <div class="node" id="nodeB"><div class="name">Replica B</div><div class="val" id="valB">0</div></div>
    </div>

    <p class="label">Network</p>
    <div class="row"><div class="seg" id="net">
      <button aria-pressed="true" data-v="healthy">Healthy</button>
      <button aria-pressed="false" data-v="partition">Partitioned</button>
    </div></div>

    <p class="label">During a partition, prefer…</p>
    <div class="row"><div class="seg" id="mode">
      <button aria-pressed="true" data-v="CP">Consistency (CP)</button>
      <button aria-pressed="false" data-v="AP">Availability (AP)</button>
    </div></div>

    <div class="actions">
      <button class="primary" id="write">Write x+1 to A</button>
      <button id="read">Read x from B</button>
    </div>

    <div class="score">
      <div class="pill" id="pC"><b>Consistent</b><span>Untested</span></div>
      <div class="pill" id="pA"><b>Available</b><span>Untested</span></div>
    </div>
    <div class="msg" id="msg" aria-live="polite">Try a write and a read while the network is healthy.</div>
  </section>
</main>
<script>
  function applyThemeFromQuery() {
    const theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  }
  applyThemeFromQuery();

  const $ = (id) => document.getElementById(id);
  const s = { a: 0, b: 0, net: 'healthy', mode: 'CP' };

  function render() {
    $('valA').textContent = s.a; $('valB').textContent = s.b;
    $('nodeB').classList.toggle('stale', s.b !== s.a);
    $('link').classList.toggle('cut', s.net === 'partition');
  }
  function say(text, cls) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }
  function score(c, a) {
    const set = (id, v) => { const p = $(id); p.className = 'pill ' + (v === null ? '' : v ? 'good' : 'bad'); p.querySelector('span').textContent = v === null ? 'Untested' : v ? 'Yes' : 'No'; };
    set('pC', c); set('pA', a);
  }
  function seg(id, key) {
    $(id).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      s[key] = b.dataset.v;
      if (key === 'net' && s.net === 'healthy' && s.a !== s.b) {
        s.b = s.a; render();
        say('Network healed. Replicas exchanged updates and converged. That\'s eventual consistency.', 'ok');
        score(true, true); return;
      }
      if (key === 'net') say(s.net === 'partition' ? 'Link cut. Both replicas still run, but they can\'t reach each other.' : 'Network healthy.', s.net === 'partition' ? 'warn' : '');
      render();
    });
  }
  seg('net', 'net'); seg('mode', 'mode');

  $('write').addEventListener('click', () => {
    if (s.net === 'healthy') { s.a++; s.b = s.a; render(); say(`Wrote x=${s.a} to A and replicated it to B before acknowledging.`, 'ok'); score(true, true); return; }
    if (s.mode === 'CP') { say('Rejected: A can\'t confirm the write with B, so it refuses rather than risk the replicas disagreeing.', 'bad'); score(true, false); return; }
    s.a++; render(); say(`Accepted: A stored x=${s.a} locally. B doesn't know yet.`, 'warn'); score(false, true);
  });
  $('read').addEventListener('click', () => {
    if (s.net === 'healthy' || s.a === s.b) { say(`B returned x=${s.b}, the latest value.`, 'ok'); score(true, true); return; }
    if (s.mode === 'CP') { say('Error: B can\'t be sure it has the latest value, so it refuses to answer.', 'bad'); score(true, false); return; }
    say(`B returned x=${s.b}, but A has x=${s.a}. B stayed available, but its answer is stale.`, 'warn'); score(false, true);
  });
  render();
</script>
</body>
</html>

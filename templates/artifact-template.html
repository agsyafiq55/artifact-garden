<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ede3; --surface: #f7f3ea; --ink: #2a2723; --muted: #756e64; --line: #d8cfbf;
    --accent: #8b5a3c; --ok: #5d6f4f; --bad: #9a4a3b; --warn: #9c7a3c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b18; --surface: #22201d; --ink: #e4ddd0; --muted: #9b9488; --line: #38352f;
      --accent: #c4916b; --ok: #95a586; --bad: #c98170; --warn: #c9a466; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b18; --surface: #22201d; --ink: #e4ddd0; --muted: #9b9488; --line: #38352f;
    --accent: #c4916b; --ok: #95a586; --bad: #c98170; --warn: #c9a466; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 'Zen Kaku Gothic New', system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1, h2 { font-family: 'Shippori Mincho', Georgia, serif; font-weight: 500; letter-spacing: 0.01em; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 20px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px 16px 12px 18px / 16px 10px 18px 12px; padding: 16px; }
  button { font: 600 .95rem 'Zen Kaku Gothic New', sans-serif; min-height: 44px; padding: 10px 16px; border-radius: 3px 7px 4px 6px / 6px 3px 7px 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--surface); border-color: transparent; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{ONE-SENTENCE HOOK: what you will see / try}}</p>

  <section class="card">
  </section>
</main>
<script>
  function applyThemeFromQuery() {
    const theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
  }
  applyThemeFromQuery();
</script>
</body>
</html>
